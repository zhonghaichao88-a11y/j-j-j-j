# SeeU：后端测试 + 自动打包安卓 APK
# 打包前在 GitHub 仓库 Settings → Secrets and variables → Actions → Variables 新建 SEEU_API（例：https://seeu.example.com）
name: SeeU

on:
  push:
    paths: ["video_chat/**", ".github/workflows/seeu.yml"]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: video_chat } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r server/requirements.txt
      - run: python -m pytest server/tests -q

  android-apk:
    needs: backend-tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: video_chat/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci
      - run: npm run web
        env: { SEEU_API: "${{ vars.SEEU_API }}" }
      - run: npx cap sync android && node scripts/patch-native.mjs
      - name: 打包（有签名证书则打正式包，否则打测试包）
        working-directory: video_chat/mobile/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            ./gradlew assembleRelease \
              -Pandroid.injected.signing.store.file=$PWD/release.keystore \
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
            cp app/build/outputs/apk/release/app-release.apk ../../seeu.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../../seeu.apk
          fi
      - uses: actions/upload-artifact@v4
        with: { name: seeu-apk, path: video_chat/seeu.apk }
